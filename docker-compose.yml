services:
  bot:
    build: .
    container_name: tg_bins
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai          # 操作历史/日志时间用的时区,按需改成你服务器所在时区
    volumes:
      # 挂载源码目录:让 config.yaml 的修改、以及『更新』按钮的 git pull 无需重建镜像即可生效。
      # 改完代码/配置后点『重启』(或 docker compose restart)即应用。
      - ./:/app
    # SQLite(data/tg_bins.db)与本地 BIN 库(data/bin-list-data.csv)都在挂载目录内,数据持久化。
    # 说明:改了 requirements.txt(依赖)后需重建镜像:docker compose up -d --build
